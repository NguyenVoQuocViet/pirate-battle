# Netlify: build frontend trong thư mục client.
# Nhớ đặt biến môi trường VITE_SERVER_URL (Site configuration → Environment variables)
# = địa chỉ server trên Render, vd: https://pirate-battle-server.onrender.com
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Model 3D / ảnh không đổi theo phiên bản: cho trình duyệt cache lâu
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
